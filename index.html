<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <title>TV Schedule</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 1400px;
            width: 96%;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            text-align: center;
            padding: 1.5rem 0;
            color: white;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .current-date {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .header-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            border-radius: 20px;
            padding: 0.5rem 1.1rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .header-btn:active {
            background: rgba(255,255,255,0.35);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.5rem 0;
            justify-content: center;
        }

        .tab {
            flex-shrink: 0;
            padding: 0.75rem 1.5rem;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .day-content {
            display: none;
        }

        .day-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .service-card {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .service-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #667eea;
        }

        .add-show-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .show-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .show-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .show-info {
            flex: 1;
        }

        .show-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.2rem;
        }

        .show-date {
            font-size: 0.75rem;
            color: #ff6b6b;
            font-weight: 600;
        }

        .show-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.25rem;
            opacity: 0.6;
        }

        .btn-icon:active {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #999;
            font-style: italic;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.875rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .today-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-left: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Install banner */
        #installBanner {
            display: none;
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            background: white;
            border-radius: 16px;
            padding: 1rem 1.25rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            z-index: 999;
            align-items: center;
            gap: 1rem;
        }
        #installBanner.show { display: flex; }
        #installBanner span { flex: 1; font-weight: 600; color: #333; font-size: 0.9rem; }
        #installBanner button {
            border: none;
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }
        #installBtn { background: #667eea; color: white; }
        #dismissBtn { background: #eee; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📺 TV Schedule</h1>
            <div class="current-date" id="currentDate"></div>
            <div class="header-actions">
                <button class="header-btn" onclick="exportData()">⬇️ Export Data</button>
                <button class="header-btn" onclick="document.getElementById('importFile').click()">⬆️ Import Data</button>
                <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
            </div>
        </header>

        <div class="tabs" id="dayTabs"></div>
        <div id="scheduleContent"></div>
    </div>

    <div class="modal" id="showModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Add Show</div>
            <form id="showForm">
                <div class="form-group">
                    <label class="form-label">Show Name</label>
                    <input type="text" class="form-input" id="showNameInput" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Premiere Date (optional)</label>
                    <input type="text" class="form-input" id="showDateInput" placeholder="e.g., Feb 23">
                </div>
                <input type="hidden" id="editService">
                <input type="hidden" id="editDay">
                <input type="hidden" id="editIndex">
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Install prompt banner -->
    <div id="installBanner">
        <span>📲 Add TV Schedule to your home screen!</span>
        <button id="dismissBtn" onclick="dismissInstall()">Not now</button>
        <button id="installBtn" onclick="installApp()">Install</button>
    </div>

    <script>
        // ── Service Worker Registration ──────────────────────────────────
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW failed:', err));
            });
        }

        // ── PWA Install Prompt ───────────────────────────────────────────
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.add('show');
        });

        function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                document.getElementById('installBanner').classList.remove('show');
            });
        }

        function dismissInstall() {
            document.getElementById('installBanner').classList.remove('show');
        }

        // ── App Logic ────────────────────────────────────────────────────
        const STORAGE_KEY = 'tvScheduleData';

        // Services: original streaming services + 2 blank "networks" for trying out new channels.
        // Days: Mon-Sun plus a trailing "Movies" tab (same service cards, for undated movie titles).
        const initialData = {
"Paramount Plus": {
  "Monday": [{"name":"FBI","date":"Oct 5, 2026"},{"name":"CIA","date":"Oct 5, 2026"}],
  "Tuesday": [{"name":"NCIS: Origins","date":"Oct 6, 2026"},{"name":"NCIS","date":"Oct 6, 2026"},{"name":"NCIS: Sydney","date":"Held for midseason (early 2027)"}],
  "Wednesday": [],
  "Thursday": [{"name":"9-1-1","date":"Oct 15, 2026"},{"name":"9-1-1: Nashville","date":"Oct 15, 2026"},{"name":"Georgie & Mandy's First Marriage","date":"Oct 8, 2026"},{"name":"Elsbeth","date":"Oct 8, 2026"},{"name":"Ghosts","date":"Halloween special Oct 29, 2026; full season held for midseason 2027"},{"name":"Star Trek: Starfleet Academy (Season 2, final)","date":"Early 2027 (exact date TBA)"}],
  "Friday": [{"name":"Boston Blue","date":"Oct 9, 2026"},{"name":"Fire Country","date":"Oct 9, 2026"},{"name":"Sheriff Country","date":"Oct 9, 2026"}],
  "Saturday": [],
  "Sunday": [{"name":"Tracker","date":"Oct 4, 2026"}],
  "Movies": []
},
"Hulu": {
  "Monday": [{"name":"The Rookie","date":"Held for midseason (expected Jan 2027)"}],
  "Tuesday": [{"name":"High Potential","date":"Held for midseason (expected Jan/early 2027)"},{"name":"Best Medicine","date":"Sept 22, 2026"},{"name":"Doc","date":"Sept 22, 2026"}],
  "Wednesday": [{"name":"Abbott Elementary","date":"Oct 7, 2026"},{"name":"Will Trent","date":"Held for midseason (expected Jan 2027)"},{"name":"Scrubs","date":"Sept 30, 2026"}],
  "Thursday": [{"name":"Animal Control","date":"Sept 27, 2026"}],
  "Friday": [],
  "Saturday": [{"name":"Code 3","date":null}],
  "Sunday": [],
  "Movies": []
},
"Peacock": {
  "Monday": [{"name":"Brilliant Minds","date":null}],
  "Tuesday": [{"name":"St. Denis Medical","date":"Nov 2, 2026"}],
  "Wednesday": [],
  "Thursday": [{"name":"Law & Order: SVU","date":"Oct 8, 2026"}],
  "Friday": [{"name":"Happy's Place","date":"Oct 23, 2026"}],
  "Saturday": [],
  "Sunday": [],
  "Movies": []
},
"Netflix": {"Monday":[],"Tuesday":[],"Wednesday":[],"Thursday":[],"Friday":[],"Saturday":[],"Sunday":[],"Movies":[]},
"Prime Video": {"Monday":[],"Tuesday":[],"Wednesday":[],"Thursday":[],"Friday":[],"Saturday":[],"Sunday":[],"Movies":[]},
"Disney Plus": {"Monday":[],"Tuesday":[],"Wednesday":[],"Thursday":[],"Friday":[],"Saturday":[],"Sunday":[],"Movies":[]},
"HBO Max": {"Monday":[],"Tuesday":[],"Wednesday":[],"Thursday":[],"Friday":[],"Saturday":[],"Sunday":[],"Movies":[]},
"Apple TV": {"Monday":[],"Tuesday":[],"Wednesday":[],"Thursday":[],"Friday":[],"Saturday":[],"Sunday":[],"Movies":[]},
"Network 1": {"Monday":[],"Tuesday":[],"Wednesday":[],"Thursday":[],"Friday":[],"Saturday":[],"Sunday":[],"Movies":[]},
"Network 2": {"Monday":[],"Tuesday":[],"Wednesday":[],"Thursday":[],"Friday":[],"Saturday":[],"Sunday":[],"Movies":[]}
};

        let scheduleData = {};
        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', 'Movies'];
        let currentDay = '';

        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    scheduleData = JSON.parse(stored);
                } else {
                    scheduleData = JSON.parse(JSON.stringify(initialData));
                    saveData();
                }
            } catch (e) {
                scheduleData = JSON.parse(JSON.stringify(initialData));
                console.error('Error loading data:', e);
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(scheduleData));
            } catch (e) {
                console.error('Error saving data:', e);
            }
        }

        // ── Export / Import (manual sync between devices, no backend needed) ──
        function exportData() {
            const dataStr = JSON.stringify(scheduleData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().split('T')[0];
            a.href = url;
            a.download = `tv-schedule-backup-${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (confirm('This will replace all shows currently in this app with the imported file. Continue?')) {
                        scheduleData = imported;
                        saveData();
                        displayDay(currentDay || getTodayDay());
                        alert('Schedule imported successfully!');
                    }
                } catch (err) {
                    alert('That file could not be read as a valid schedule backup (invalid JSON).');
                    console.error(err);
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // allow re-importing the same file later
        }

        function getTodayDay() {
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return dayNames[new Date().getDay()];
        }

        function displayCurrentDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', options);
        }

        function createTabs() {
            const tabsContainer = document.getElementById('dayTabs');
            const today = getTodayDay();

            days.forEach(day => {
                const tab = document.createElement('button');
                tab.className = 'tab';
                tab.textContent = day;

                if (day === today) {
                    const indicator = document.createElement('span');
                    indicator.className = 'today-indicator';
                    tab.appendChild(indicator);
                    tab.classList.add('active');
                    currentDay = day;
                }

                tab.onclick = function() { switchTab(day, this); };
                tabsContainer.appendChild(tab);
            });
        }

        function switchTab(day, element) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            currentDay = day;
            displayDay(day);
        }

        function displayDay(day) {
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '';

            const grid = document.createElement('div');
            grid.className = 'service-grid';

            const services = Object.keys(scheduleData);

            services.forEach(service => {
                const shows = (scheduleData[service] && scheduleData[service][day]) || [];

                const card = document.createElement('div');
                card.className = 'service-card';

                const header = document.createElement('div');
                header.className = 'service-header';

                const serviceName = document.createElement('div');
                serviceName.className = 'service-name';
                serviceName.textContent = service;

                const addBtn = document.createElement('button');
                addBtn.className = 'add-show-btn';
                addBtn.textContent = '+ Add';
                addBtn.onclick = function() { openAddModal(service, day); };

                header.appendChild(serviceName);
                header.appendChild(addBtn);
                card.appendChild(header);

                if (shows.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.textContent = 'No shows scheduled';
                    card.appendChild(empty);
                } else {
                    const showList = document.createElement('div');
                    showList.className = 'show-list';

                    shows.forEach((show, index) => {
                        const showItem = document.createElement('div');
                        showItem.className = 'show-item';

                        const showInfo = document.createElement('div');
                        showInfo.className = 'show-info';

                        const showName = document.createElement('div');
                        showName.className = 'show-name';
                        showName.textContent = show.name;
                        showInfo.appendChild(showName);

                        if (show.date) {
                            const showDate = document.createElement('div');
                            showDate.className = 'show-date';
                            showDate.textContent = 'Premieres: ' + show.date;
                            showInfo.appendChild(showDate);
                        }

                        const actions = document.createElement('div');
                        actions.className = 'show-actions';

                        const editBtn = document.createElement('button');
                        editBtn.className = 'btn-icon';
                        editBtn.textContent = '✏️';
                        editBtn.onclick = function() { openEditModal(service, day, index); };

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'btn-icon';
                        deleteBtn.textContent = '🗑️';
                        deleteBtn.onclick = function() { deleteShow(service, day, index); };

                        actions.appendChild(editBtn);
                        actions.appendChild(deleteBtn);

                        showItem.appendChild(showInfo);
                        showItem.appendChild(actions);
                        showList.appendChild(showItem);
                    });

                    card.appendChild(showList);
                }

                grid.appendChild(card);
            });

            contentDiv.appendChild(grid);
        }

        function openAddModal(service, day) {
            document.getElementById('modalTitle').textContent = 'Add Show';
            document.getElementById('showForm').reset();
            document.getElementById('editService').value = service;
            document.getElementById('editDay').value = day;
            document.getElementById('editIndex').value = '';
            document.getElementById('showModal').classList.add('active');
        }

        function openEditModal(service, day, index) {
            const show = scheduleData[service][day][index];
            document.getElementById('modalTitle').textContent = 'Edit Show';
            document.getElementById('showNameInput').value = show.name;
            document.getElementById('showDateInput').value = show.date || '';
            document.getElementById('editService').value = service;
            document.getElementById('editDay').value = day;
            document.getElementById('editIndex').value = index;
            document.getElementById('showModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('showModal').classList.remove('active');
        }

        document.getElementById('showForm').onsubmit = function(e) {
            e.preventDefault();

            const service = document.getElementById('editService').value;
            const day = document.getElementById('editDay').value;
            const index = document.getElementById('editIndex').value;
            const name = document.getElementById('showNameInput').value.trim();
            const date = document.getElementById('showDateInput').value.trim() || null;

            const showData = { name: name, date: date };

            if (!scheduleData[service][day]) scheduleData[service][day] = [];

            if (index === '') {
                scheduleData[service][day].push(showData);
            } else {
                scheduleData[service][day][index] = showData;
            }

            saveData();
            displayDay(day);
            closeModal();
        };

        function deleteShow(service, day, index) {
            if (confirm('Delete this show?')) {
                scheduleData[service][day].splice(index, 1);
                saveData();
                displayDay(day);
            }
        }

        // Initialize
        loadData();
        displayCurrentDate();
        createTabs();
        displayDay(currentDay || getTodayDay());
    </script>
</body>
</html>
